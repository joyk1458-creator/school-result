<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>বিদ্যালয় রেজাল্ট পোর্টাল</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Bengali","Arial",sans-serif;
    background:linear-gradient(135deg,#eef2ff,#f0fdf4);
    color:#172033;
}

.header{
    background:linear-gradient(135deg,#312e81,#2563eb);
    color:white;
    text-align:center;
    padding:35px 15px;
    border-radius:0 0 35px 35px;
    box-shadow:0 10px 30px rgba(37,99,235,.25);
}

.header h1{
    margin:0;
    font-size:30px;
    font-weight:800;
}

.header p{
    margin:8px 0 0;
    font-size:17px;
    opacity:.95;
}

.container{
    max-width:700px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:22px;
    box-shadow:0 10px 35px rgba(15,23,42,.10);
    margin-bottom:20px;
}

.card h2{
    margin-top:0;
    color:#1e3a8a;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:700;
}

select,input,button{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #d1d5db;
    font-size:16px;
    outline:none;
}

select:focus,input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

button{
    margin-top:20px;
    border:none;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(37,99,235,.25);
}

button:active{
    transform:scale(.98);
}

.result{
    display:none;
}

.student-box{
    background:linear-gradient(135deg,#eff6ff,#eef2ff);
    border-radius:16px;
    padding:18px;
    margin-bottom:20px;
}

.student-box p{
    margin:8px 0;
    font-size:17px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    min-width:480px;
}

th{
    background:#1e3a8a;
    color:white;
    padding:12px;
}

td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:center;
}

td:first-child{
    text-align:left;
}

.grade{
    font-weight:900;
}

.grade-aplus{
    color:#15803d;
}

.grade-a{
    color:#2563eb;
}

.grade-aminus{
    color:#7c3aed;
}

.grade-b{
    color:#d97706;
}

.grade-c{
    color:#ea580c;
}

.grade-d{
    color:#dc2626;
}

.grade-f{
    color:#991b1b;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.summary div{
    background:#f8fafc;
    border-radius:15px;
    padding:15px;
    text-align:center;
    border:1px solid #e5e7eb;
}

.summary strong{
    display:block;
    font-size:22px;
    color:#1e3a8a;
    margin-top:5px;
}

.final-grade{
    text-align:center;
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    background:linear-gradient(135deg,#dcfce7,#dbeafe);
}

.final-grade span{
    font-size:35px;
    font-weight:900;
    color:#15803d;
}

.footer{
    text-align:center;
    padding:25px;
    color:#64748b;
    font-size:14px;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    text-align:center;
}
